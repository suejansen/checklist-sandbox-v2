<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#f7f4ef">
	<title>Bringing Home a Dog | Set up your plan</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap');

		:root {
			--ink: #203b3a;
			--muted: #657572;
			--paper: #f7f4ef;
			--panel: #fffdf9;
			--line: #d9e0da;
			--accent: #e56d4f;
			--accent-dark: #bd4e35;
			--shadow: 0 18px 45px rgba(37, 65, 58, 0.09);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			color: var(--ink);
			background:
				radial-gradient(circle at 88% 0%, rgba(220, 236, 228, 0.9) 0, rgba(220, 236, 228, 0) 32%),
				linear-gradient(145deg, #f7f4ef 0%, #eef3ee 100%);
			font-family: 'DM Sans', sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		main {
			width: min(100%, 680px);
			min-height: 100svh;
			margin: 0 auto;
			padding: 28px 20px 32px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			color: var(--muted);
			font-size: 0.77rem;
			font-weight: 700;
			letter-spacing: 0.09em;
			text-transform: uppercase;
		}

		.brand-mark {
			display: grid;
			width: 30px;
			height: 30px;
			place-items: center;
			border-radius: 9px;
			color: #fff;
			background: var(--accent);
			font-size: 1.05rem;
			line-height: 1;
		}

		.home-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			margin-bottom: 24px;
			color: var(--muted);
			font-size: 0.88rem;
			font-weight: 700;
			text-decoration: none;
		}

		.home-link:hover { color: var(--ink); }
		.home-link:focus-visible { outline: 2px solid rgba(229, 109, 79, 0.35); outline-offset: 4px; }

		header { margin: 54px 0 30px; }

		h1 {
			max-width: 560px;
			margin: 0 0 26px;
			font-family: 'Fraunces', Georgia, serif;
			font-size: clamp(2.65rem, 12vw, 4.5rem);
			font-weight: 600;
			letter-spacing: -0.03em;
			line-height: 0.98;
		}

		h2 {
			margin: 0 0 14px;
			font-family: 'Fraunces', Georgia, serif;
			font-size: clamp(2.1rem, 9vw, 3.2rem);
			font-weight: 600;
			letter-spacing: -0.02em;
			line-height: 1;
		}

		.intro {
			max-width: 480px;
			margin: 0;
			color: var(--muted);
			font-size: 1rem;
			line-height: 1.55;
		}

		form {
			padding: 24px 18px 18px;
			border: 1px solid rgba(217, 224, 218, 0.85);
			border-radius: 18px;
			background: rgba(255, 253, 249, 0.86);
			box-shadow: var(--shadow);
		}

		.question + .question { margin-top: 29px; }

		fieldset {
			min-width: 0;
			margin: 0;
			padding: 0;
			border: 0;
		}

		legend, .question-label {
			display: block;
			margin-bottom: 11px;
			color: var(--ink);
			font-size: 1rem;
			font-weight: 700;
			line-height: 1.35;
		}

		.choice-grid {
			display: grid;
			gap: 9px;
		}

		.choice {
			position: relative;
			display: flex;
			align-items: center;
			min-height: 56px;
			padding: 13px 14px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: var(--panel);
			cursor: pointer;
			transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
		}

		.choice:hover { border-color: #a9bbb1; }
		.choice:has(input:checked) {
			border-color: var(--accent);
			background: #fff2ed;
		}
		.choice:active { transform: scale(0.99); }

		.choice input {
			width: 20px;
			height: 20px;
			margin: 0 11px 0 0;
			accent-color: var(--accent);
			flex: 0 0 auto;
		}

		.choice span { font-size: 0.96rem; font-weight: 500; }

		input[type="date"] {
			width: 100%;
			min-height: 56px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 12px;
			color: var(--ink);
			background: var(--panel);
			font: inherit;
			font-size: 1rem;
			outline: 0;
		}

		input[type="date"]:focus,
		.choice:has(input:focus-visible) {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(229, 109, 79, 0.17);
		}

		#house-training-question[hidden] { display: none; }

		.submit-wrap {
			margin-top: 31px;
			padding-top: 18px;
			border-top: 1px solid var(--line);
		}

		button {
			width: 100%;
			min-height: 58px;
			padding: 14px 18px;
			border: 0;
			border-radius: 12px;
			color: #fff;
			background: var(--accent);
			box-shadow: 0 8px 16px rgba(189, 78, 53, 0.18);
			cursor: pointer;
			font: inherit;
			font-size: 1rem;
			font-weight: 700;
			transition: background 160ms ease, transform 160ms ease;
		}

		button:hover { background: var(--accent-dark); }
		button:active { transform: translateY(1px); }
		button:focus-visible { outline: 3px solid rgba(229, 109, 79, 0.35); outline-offset: 3px; }

		.saved-message {
			min-height: 1.25em;
			margin: 12px 0 0;
			color: #34715d;
			font-size: 0.87rem;
			text-align: center;
		}

		@media (min-width: 600px) {
			main { padding: 38px 30px 48px; }
			form { padding: 30px; }
			.choice-grid { grid-template-columns: repeat(2, 1fr); }
			.question:first-child .choice-grid,
			.question:last-child .choice-grid { grid-template-columns: repeat(2, 1fr); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main>
		<a class="home-link" href="index.html" aria-label="Return to Home">← Home</a>
		<div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Nest &amp; Go</div>

		<header>
			<h1>Bringing Home a Dog</h1>
			<h2>Let’s get ready.</h2>
			<p class="intro">A few details will help us shape a plan for bringing your new dog home.</p>
		</header>

		<form id="dog-setup" novalidate>
			<fieldset class="question">
				<legend>Who are you bringing home?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="dogAge" value="puppy" required><span>A puppy</span></label>
					<label class="choice"><input type="radio" name="dogAge" value="adult-dog"><span>An adult dog</span></label>
				</div>
			</fieldset>

			<div class="question">
				<label class="question-label" for="arrival-date">When are they coming home?</label>
				<input id="arrival-date" name="arrivalDate" type="date" required>
			</div>

			<fieldset class="question">
				<legend>Are there already pets at home?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="existingPets" value="none" required><span>No</span></label>
					<label class="choice"><input type="radio" name="existingPets" value="dogs"><span>Yes, dog(s)</span></label>
					<label class="choice"><input type="radio" name="existingPets" value="cats"><span>Yes, cat(s)</span></label>
					<label class="choice"><input type="radio" name="existingPets" value="dogs-and-cats"><span>Yes, both dogs and cats</span></label>
					<label class="choice"><input type="radio" name="existingPets" value="other"><span>Yes, other pets</span></label>
				</div>
			</fieldset>

			<fieldset class="question">
				<legend>Are there children living at home?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="children" value="none" required><span>No</span></label>
					<label class="choice"><input type="radio" name="children" value="younger"><span>Yes, younger children</span></label>
					<label class="choice"><input type="radio" name="children" value="older"><span>Yes, older children</span></label>
					<label class="choice"><input type="radio" name="children" value="younger-and-older"><span>Yes, both younger and older children</span></label>
				</div>
			</fieldset>

			<fieldset id="house-training-question" class="question" hidden>
				<legend>Is your dog house-trained?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="houseTraining" value="yes"><span>Yes</span></label>
					<label class="choice"><input type="radio" name="houseTraining" value="no"><span>No</span></label>
					<label class="choice"><input type="radio" name="houseTraining" value="not-sure"><span>Not sure</span></label>
				</div>
			</fieldset>

			<div class="submit-wrap">
				<button type="submit">Build My Plan</button>
				<p id="saved-message" class="saved-message" role="status" aria-live="polite"></p>
			</div>
		</form>
	</main>

	<script>
		const form = document.querySelector('#dog-setup');
		const dogAgeInputs = [...form.elements.dogAge];
		const houseTrainingQuestion = document.querySelector('#house-training-question');
		const houseTrainingInputs = [...form.elements.houseTraining];
		const savedMessage = document.querySelector('#saved-message');
		const storageKey = 'bringing-home-a-dog-setup';

		const updateHouseTrainingQuestion = () => {
			const isAdultDog = form.elements.dogAge.value === 'adult-dog';
			houseTrainingQuestion.hidden = !isAdultDog;
			houseTrainingInputs.forEach((input) => {
				input.required = isAdultDog;
				if (!isAdultDog) input.checked = false;
			});
		};

		const restoreSetupForm = (answers) => {
			form.elements.arrivalDate.value = answers.arrivalDate || '';
			['dogAge', 'existingPets', 'children', 'houseTraining'].forEach((fieldName) => {
				const option = [...form.elements[fieldName]].find((input) => input.value === answers[fieldName]);
				if (option) option.checked = true;
			});
			updateHouseTrainingQuestion();
		};

		dogAgeInputs.forEach((input) => input.addEventListener('change', updateHouseTrainingQuestion));

		const savedSetup = JSON.parse(localStorage.getItem(storageKey) || 'null');
		if (savedSetup) restoreSetupForm(savedSetup);

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			updateHouseTrainingQuestion();

			if (!form.checkValidity()) {
				form.reportValidity();
				return;
			}

			const answers = Object.fromEntries(new FormData(form).entries());
			if (answers.dogAge !== 'adult-dog') delete answers.houseTraining;
			localStorage.setItem(storageKey, JSON.stringify(answers));
			savedMessage.textContent = 'Your answers are saved.';
		});
	</script>
</body>
</html>
