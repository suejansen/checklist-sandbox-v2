<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#f7f4ef">
	<title>Moving House | Set up your checklist</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap');

		:root {
			--ink: #203b3a;
			--muted: #657572;
			--paper: #f7f4ef;
			--panel: #fffdf9;
			--line: #d9e0da;
			--accent: #e56d4f;
			--accent-dark: #bd4e35;
			--mint: #dcece4;
			--shadow: 0 18px 45px rgba(37, 65, 58, 0.09);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			color: var(--ink);
			background:
				radial-gradient(circle at 88% 0%, rgba(220, 236, 228, 0.9) 0, rgba(220, 236, 228, 0) 32%),
				linear-gradient(145deg, #f7f4ef 0%, #eef3ee 100%);
			font-family: 'DM Sans', sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		main {
			width: min(100%, 680px);
			min-height: 100svh;
			margin: 0 auto;
			padding: 28px 20px 32px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			color: var(--muted);
			font-size: 0.77rem;
			font-weight: 700;
			letter-spacing: 0.09em;
			text-transform: uppercase;
		}

		.brand-mark {
			display: grid;
			width: 30px;
			height: 30px;
			place-items: center;
			border-radius: 9px;
			color: #fff;
			background: var(--accent);
			font-size: 1.05rem;
			line-height: 1;
		}

		header { margin: 54px 0 30px; }

		h1 {
			max-width: 560px;
			margin: 0 0 14px;
			font-family: 'Fraunces', Georgia, serif;
			font-size: clamp(2.65rem, 12vw, 4.5rem);
			font-weight: 600;
			letter-spacing: -0.03em;
			line-height: 0.98;
		}

		.intro {
			max-width: 480px;
			margin: 0;
			color: var(--muted);
			font-size: 1rem;
			line-height: 1.55;
		}

		form {
			padding: 24px 18px 18px;
			border: 1px solid rgba(217, 224, 218, 0.85);
			border-radius: 18px;
			background: rgba(255, 253, 249, 0.86);
			box-shadow: var(--shadow);
		}

		fieldset {
			min-width: 0;
			margin: 0;
			padding: 0;
			border: 0;
		}

		.question + .question { margin-top: 29px; }

		legend, .question-label {
			display: block;
			margin-bottom: 11px;
			color: var(--ink);
			font-size: 1rem;
			font-weight: 700;
			line-height: 1.35;
		}

		.choice-grid {
			display: grid;
			gap: 9px;
		}

		.choice {
			position: relative;
			display: flex;
			align-items: center;
			min-height: 56px;
			padding: 13px 14px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: var(--panel);
			cursor: pointer;
			transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
		}

		.choice:hover { border-color: #a9bbb1; }
		.choice:has(input:checked) {
			border-color: var(--accent);
			background: #fff2ed;
		}
		.choice:active { transform: scale(0.99); }

		.choice input {
			width: 20px;
			height: 20px;
			margin: 0 11px 0 0;
			accent-color: var(--accent);
			flex: 0 0 auto;
		}

		.choice span { font-size: 0.96rem; font-weight: 500; }

		input[type="date"] {
			width: 100%;
			min-height: 56px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 12px;
			color: var(--ink);
			background: var(--panel);
			font: inherit;
			font-size: 1rem;
			outline: 0;
		}

		input[type="date"]:focus,
		.choice:has(input:focus-visible) {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(229, 109, 79, 0.17);
		}

		.submit-wrap {
			margin-top: 31px;
			padding-top: 18px;
			border-top: 1px solid var(--line);
		}

		button {
			width: 100%;
			min-height: 58px;
			padding: 14px 18px;
			border: 0;
			border-radius: 12px;
			color: #fff;
			background: var(--accent);
			box-shadow: 0 8px 16px rgba(189, 78, 53, 0.18);
			cursor: pointer;
			font: inherit;
			font-size: 1rem;
			font-weight: 700;
			transition: background 160ms ease, transform 160ms ease;
		}

		button:hover { background: var(--accent-dark); }
		button:active { transform: translateY(1px); }
		button:focus-visible { outline: 3px solid rgba(229, 109, 79, 0.35); outline-offset: 3px; }

		.saved-message {
			min-height: 1.25em;
			margin: 12px 0 0;
			color: #34715d;
			font-size: 0.87rem;
			text-align: center;
		}

		.checklist {
			margin-top: 28px;
			padding: 24px 18px;
			border: 1px solid rgba(217, 224, 218, 0.85);
			border-radius: 18px;
			background: rgba(255, 253, 249, 0.86);
			box-shadow: var(--shadow);
		}

		.checklist h2 {
			margin: 0;
			font-family: 'Fraunces', Georgia, serif;
			font-size: 1.8rem;
			font-weight: 600;
			letter-spacing: -0.02em;
		}

		.progress-summary {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin: 8px 0 10px;
			color: var(--muted);
			font-size: 0.88rem;
		}

		.progress-bar {
			height: 8px;
			margin-bottom: 17px;
			border-radius: 999px;
			background: var(--mint);
			overflow: hidden;
		}

		.progress-bar-fill {
			width: 0%;
			height: 100%;
			border-radius: inherit;
			background: var(--accent);
			transition: width 160ms ease;
		}

		.task {
			display: flex;
			align-items: flex-start;
			gap: 11px;
			padding: 13px 0;
			border-top: 1px solid var(--line);
			cursor: pointer;
			font-size: 0.96rem;
			line-height: 1.4;
		}

		.task input {
			width: 20px;
			height: 20px;
			margin: 0;
			accent-color: var(--accent);
			flex: 0 0 auto;
		}

		.task.completed {
			color: var(--muted);
			text-decoration: line-through;
		}

		@media (min-width: 600px) {
			main { padding: 38px 30px 48px; }
			form { padding: 30px; }
			.checklist { padding: 30px; }
			.choice-grid { grid-template-columns: repeat(2, 1fr); }
			.question:first-child .choice-grid,
			.question:last-child .choice-grid { grid-template-columns: repeat(2, 1fr); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main>
		<div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Nest &amp; Go</div>

		<header>
			<h1>Let’s get you moving.</h1>
			<p class="intro">A few details will help us shape a moving plan that fits your life.</p>
		</header>

		<form id="moving-setup" novalidate>
			<div class="question">
				<label class="question-label" for="moving-date">When are you moving?</label>
				<input id="moving-date" name="movingDate" type="date" required>
			</div>

			<fieldset class="question">
				<legend>Your current home</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="homeType" value="renting" required><span>Renting</span></label>
					<label class="choice"><input type="radio" name="homeType" value="own"><span>Own</span></label>
				</div>
			</fieldset>

			<fieldset class="question">
				<legend>How are you moving?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="movingMethod" value="moving-company" required><span>Moving company</span></label>
					<label class="choice"><input type="radio" name="movingMethod" value="doing-it-myself"><span>Doing it myself</span></label>
					<label class="choice"><input type="radio" name="movingMethod" value="not-sure"><span>Not sure yet</span></label>
				</div>
			</fieldset>

			<fieldset class="question">
				<legend>Where are you moving?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="destination" value="locally" required><span>Locally</span></label>
					<label class="choice"><input type="radio" name="destination" value="different-province-state"><span>Different province or state</span></label>
					<label class="choice"><input type="radio" name="destination" value="different-country"><span>Different country</span></label>
				</div>
			</fieldset>

			<fieldset class="question">
				<legend>Are any pets moving with you?</legend>
				<div class="choice-grid">
					<label class="choice"><input type="radio" name="pets" value="yes" required><span>Yes</span></label>
					<label class="choice"><input type="radio" name="pets" value="no"><span>No</span></label>
				</div>
			</fieldset>

			<div class="submit-wrap">
				<button type="submit">Build My Checklist</button>
				<p id="saved-message" class="saved-message" role="status" aria-live="polite"></p>
			</div>
		</form>

			<section id="checklist" class="checklist" hidden aria-labelledby="checklist-title">
				<h2 id="checklist-title">3 Months Out</h2>
				<div class="progress-summary">
					<span>Progress</span>
					<strong id="progress-percent">0% complete</strong>
				</div>
				<div class="progress-bar" role="progressbar" aria-label="Checklist progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
					<div id="progress-bar-fill" class="progress-bar-fill"></div>
				</div>
				<div id="task-list"></div>
			</section>
	</main>

	<script>
		const form = document.querySelector('#moving-setup');
		const savedMessage = document.querySelector('#saved-message');
		const checklist = document.querySelector('#checklist');
		const taskList = document.querySelector('#task-list');
		const progressPercent = document.querySelector('#progress-percent');
		const progressBar = document.querySelector('.progress-bar');
		const progressBarFill = document.querySelector('#progress-bar-fill');
		const storageKey = 'moving-house-setup';
		const completionStorageKey = 'moving-house-task-completion';
		const tasks = [
			{ id: 'moving-budget', label: 'Set a moving budget' },
			{ id: 'declutter-belongings', label: 'Sort through belongings and declutter' },
			{ id: 'book-moving-company', label: 'Research and book a moving company', showWhen: (answers) => answers.movingMethod === 'moving-company' },
			{ id: 'rent-moving-truck', label: 'Research truck or van rental', showWhen: (answers) => answers.movingMethod === 'doing-it-myself' },
			{ id: 'check-home-notice', label: 'Check notice requirements for your current home', showWhen: (answers) => answers.homeType === 'renting' },
			{ id: 'prepare-home-handover', label: 'Prepare your home for sale or handover', showWhen: (answers) => answers.homeType === 'own' },
			{ id: 'research-pet-moving', label: 'Research pet moving requirements', showWhen: (answers) => answers.pets === 'yes' },
			{ id: 'research-international-moving', label: 'Research international moving requirements', showWhen: (answers) => answers.destination === 'different-country' }
		];

		const getCalendarDate = (date) => new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));

		const getCurrentStage = (daysUntilMove) => {
			if (daysUntilMove > 60) return '3 Months Out';
			if (daysUntilMove >= 31) return '2 Months Out';
			if (daysUntilMove >= 15) return '1 Month Out';
			if (daysUntilMove >= 8) return '2 Weeks Out';
			if (daysUntilMove >= 2) return 'Moving Week';
			if (daysUntilMove === 1) return 'Tomorrow';
			if (daysUntilMove === 0) return 'Moving Day';
			return 'After the Move';
		};

		const getCompletionState = () => JSON.parse(localStorage.getItem(completionStorageKey) || '{}');

		const restoreSetupForm = (answers) => {
			form.elements.movingDate.value = answers.movingDate || '';
			['homeType', 'movingMethod', 'destination', 'pets'].forEach((fieldName) => {
				const option = [...form.elements[fieldName]].find((input) => input.value === answers[fieldName]);
				if (option) option.checked = true;
			});
		};

		const showSavedMessage = (answers) => {
			if (answers.daysUntilMove > 1) {
				savedMessage.textContent = `Your move is in ${answers.daysUntilMove} days. You are currently in the ${answers.currentStage} stage.`;
			} else if (answers.daysUntilMove === 1) {
				savedMessage.textContent = `Your move is tomorrow. You are currently in the ${answers.currentStage} stage.`;
			} else if (answers.daysUntilMove === 0) {
				savedMessage.textContent = `Your move is today. You are currently in the ${answers.currentStage} stage.`;
			} else {
				savedMessage.textContent = `Your move has already happened. You are currently in the ${answers.currentStage} stage.`;
			}
		};

		const renderChecklist = (answers) => {
			const applicableTasks = tasks.filter((task) => !task.showWhen || task.showWhen(answers));
			const completionState = getCompletionState();
			const orderedTasks = [...applicableTasks].sort((firstTask, secondTask) => {
				return Number(Boolean(completionState[firstTask.id])) - Number(Boolean(completionState[secondTask.id]));
			});

			taskList.replaceChildren(...orderedTasks.map((task) => {
				const isComplete = Boolean(completionState[task.id]);
				const label = document.createElement('label');
				label.className = `task${isComplete ? ' completed' : ''}`;
				label.htmlFor = `task-${task.id}`;

				const checkbox = document.createElement('input');
				checkbox.type = 'checkbox';
				checkbox.id = `task-${task.id}`;
				checkbox.checked = isComplete;
				checkbox.dataset.taskId = task.id;
				checkbox.addEventListener('change', () => {
					const updatedState = getCompletionState();
					updatedState[task.id] = checkbox.checked;
					localStorage.setItem(completionStorageKey, JSON.stringify(updatedState));
					renderChecklist(answers);
				});

				const text = document.createElement('span');
				text.textContent = task.label;
				label.append(checkbox, text);
				return label;
			}));

			const completedCount = applicableTasks.filter((task) => completionState[task.id]).length;
			const percentage = Math.round((completedCount / applicableTasks.length) * 100);
			progressPercent.textContent = `${percentage}% complete`;
			progressBar.setAttribute('aria-valuenow', percentage);
			progressBarFill.style.width = `${percentage}%`;
			checklist.hidden = false;
		};

		const savedSetup = JSON.parse(localStorage.getItem(storageKey) || 'null');
		if (savedSetup) {
			restoreSetupForm(savedSetup);
			renderChecklist(savedSetup);
			showSavedMessage(savedSetup);
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();

			if (!form.checkValidity()) {
				form.reportValidity();
				return;
			}

			const formData = new FormData(form);
			const answers = Object.fromEntries(formData.entries());
			const [year, month, day] = answers.movingDate.split('-').map(Number);
			const movingDate = new Date(Date.UTC(year, month - 1, day));
			const today = getCalendarDate(new Date());
			const daysUntilMove = Math.round((movingDate - today) / (1000 * 60 * 60 * 24));
			const currentStage = getCurrentStage(daysUntilMove);

			answers.daysUntilMove = daysUntilMove;
			answers.currentStage = currentStage;
			localStorage.setItem(storageKey, JSON.stringify(answers));

			renderChecklist(answers);
			showSavedMessage(answers);
		});
	</script>
</body>
</html>
